{% extends 'base.html' %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">

    <div class="text-center mb-5">
        <h1 class="display-2 fw-bold text-uppercase" style="letter-spacing: -2px;">
            Valoran<span style="color: #ff4655;">Tracker</span>
        </h1>
        <p class="lead text-muted">
            Introduce tu <strong>Nickname#TAG</strong> para consultar tus estadísticas
        </p>
    </div>

    <div class="w-100 position-relative" style="max-width: 700px;">
        <form id="search-form" method="GET" autocomplete="off">
            <div class="input-group input-group-lg shadow-lg">
                <input
                    id="search-input"
                    type="text"
                    name="q"
                    class="form-control border-0 px-4"
                    placeholder="Ej: TenZ#NA1"
                    style="background: #ffffff; height: 70px; border-radius: 10px 0 0 10px; color: #0f1923;"
                >
                <button
                    class="btn btn-primary-custom px-5 fw-bold text-uppercase"
                    type="submit"
                    style="background-color: #ff4655; border: none; color: white; border-radius: 0 10px 10px 0;"
                >
                    Buscar
                </button>
            </div>
        </form>

        <div id="results-box" class="list-group shadow-lg position-absolute w-100 mt-1 d-none" style="z-index: 1000; border-radius: 8px; overflow: hidden;">
            </div>
    </div>

</div>

<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0f1923 !important;
    }

    body {
        color: #ece8e1;
        display: flex;
        flex-direction: column;
    }

    .text-muted {
        color: #8b978f !important;
    }

    .form-control:focus {
        box-shadow: 0 0 0 0.25rem rgba(255, 70, 85, 0.25);
        border: 1px solid #ff4655;
        outline: none;
    }

    .btn-primary-custom:hover {
        background-color: #d63d48 !important;
        transform: scale(1.02);
        transition: all 0.2s ease;
    }

    #results-box {
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid rgba(255, 70, 85, 0.3);
    }

    .suggestion-item {
        background: #ffffff;
        color: #0f1923;
        font-weight: 600;
        border: none;
        transition: all 0.2s;
        text-decoration: none;
    }

    .suggestion-item:hover {
        background-color: #f8f9fa !important;
        color: #ff4655 !important;
        border-left: 5px solid #ff4655 !important;
        padding-left: 25px !important;
    }
</style>

<script>
    const searchInput = document.getElementById('search-input');
    const resultsBox = document.getElementById('results-box');
    const searchForm = document.getElementById('search-form');

    // 1. Lógica de Autocompletado
    searchInput.addEventListener('keyup', e => {
        const query = e.target.value;

        if (query.length > 1) {
            fetch(`/sugerencias/?q=${query}`)
                .then(response => response.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        resultsBox.innerHTML = "";
                        resultsBox.classList.remove('d-none');

                        data.results.forEach(item => {
                            // IMPORTANTE: encodeURIComponent y barra final /
                            const safeValue = encodeURIComponent(item);
                            resultsBox.innerHTML += `
                                <a href="/jugadores/${safeValue}/" class="list-group-item list-group-item-action suggestion-item py-3">
                                    <i class="fa-solid fa-magnifying-glass me-2 text-muted small"></i> ${item}
                                </a>`;
                        });
                    } else {
                        resultsBox.classList.add('d-none');
                    }
                });
        } else {
            resultsBox.classList.add('d-none');
        }
    });

    // 2. Manejar el envío manual del formulario (Enter o botón Buscar)
    searchForm.addEventListener('submit', e => {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `/jugadores/${encodeURIComponent(query)}/`;
        }
    });

    // 3. Cerrar sugerencias al hacer clic fuera
    document.addEventListener('click', e => {
        if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
            resultsBox.classList.add('d-none');
        }
    });
</script>
{% endblock %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ValoranTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top, #16202a 0%, #0f1923 60%, #0a0f14 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(15, 25, 35, 0.85) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 70, 85, 0.25);
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ff4655 !important;
            text-shadow: 0 0 12px rgba(255, 70, 85, 0.8);
        }

        .nav-link {
            color: rgba(255,255,255,0.7) !important;
            transition: 0.2s;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #ff4655 !important;
            text-shadow: 0 0 8px rgba(255, 70, 85, 0.7);
        }

        .btn-primary-custom {
            background: linear-gradient(45deg, #ff4655, #ff7b89);
            border: none;
            color: white;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .btn-primary-custom:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 70, 85, 0.5);
        }

        .card {
            background: rgba(20, 28, 38, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: rgba(255, 70, 85, 0.3);
        }

        .highlight {
            color: #ff4655;
            text-shadow: 0 0 15px rgba(255, 70, 85, 0.6);
        }
    </style>
</head>
<body style="background-color: #0f1923; color: white;">

    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
    <div class="container-fluid">

        <a class="navbar-brand brand" href="#">
            VALORANTRACKER
        </a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto gap-2">
                <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Stats</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Buscar</a></li>
            </ul>
        </div>

    </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValoranTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            /* Degradado infinito corregido */
            background: radial-gradient(circle at top, #16202a 0%, #0f1923 60%, #0a0f14 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
        }

        .navbar {
            background: rgba(15, 25, 35, 0.9) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 70, 85, 0.3);
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ff4655 !important;
            text-shadow: 0 0 10px rgba(255, 70, 85, 0.5);
        }

        .nav-link {
            color: rgba(255,255,255,0.8) !important;
            transition: 0.3s;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #ff4655 !important;
        }

        /* Botón de Perfil con estilo Valorant */
        .btn-profile {
            background: transparent;
            border: 1px solid #ff4655;
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-profile:hover {
            background: #ff4655;
            color: white;
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.4);
        }

        /* Botón de Registro resaltado */
        .nav-register {
            background: rgba(255, 70, 85, 0.1);
            border-radius: 4px;
        }

        .highlight {
            color: #ff4655;
            text-shadow: 0 0 15px rgba(255, 70, 85, 0.6);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3 sticky-top">
    <div class="container-fluid">

        <a class="navbar-brand brand" href="/">
            VALORANTRACKER
        </a>

        <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto align-items-center gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="#">Iniciar Sesión</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-register px-3" href="#">Registrarse</a>
                </li>

                <div class="vr d-none d-lg-block mx-2" style="color: rgba(255,255,255,0.3);"></div>

                <li class="nav-item mt-2 mt-lg-0">
                    <a class="btn btn-profile" href="#">
                        <i class="fa-solid fa-user-gear"></i>
                        <span>Mi Perfil</span>
                    </a>
                </li>
            </ul>
        </div>

    </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
